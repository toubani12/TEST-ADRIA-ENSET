server:
  port: 9090

spring:
  application:
    name: gatway-service
  cloud:
    config:
      enabled: false
    gateway:
      server:
        webmvc:
          routes:
            - id: account-api
              uri: http://localhost:8081
              predicates:
                - Path=/api/accounts/**
            - id: transaction-api
              uri: http://localhost:8082
              predicates:
                - Path=/api/transactions/**
            # /account-service/graphql, /account-service/sse ... -> account-service
            - id: account-service
              uri: http://localhost:8081
              predicates:
                - Path=/account-service/**
              filters:
                - StripPrefix=1
            - id: transaction-service
              uri: http://localhost:8082
              predicates:
                - Path=/transaction-service/**
              filters:
                - StripPrefix=1

eureka:
  client:
    enabled: false
