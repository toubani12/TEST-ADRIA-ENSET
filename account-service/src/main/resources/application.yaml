server:
  port: 8081

spring:
  application:
    name: account-service
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:h2:mem:account-db
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
  graphql:
    graphiql:
      enabled: true
  

eureka:
  instance:
    prefer-ip-address: true



app:
  security:
    enabled: ${SECURITY_ENABLED:true}
  seed:
    enabled: true

# --- Keycloak (resource server JWT, actif si SECURITY_ENABLED=true) ---
spring.security.oauth2.resourceserver.jwt:
  issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8080/realms/bank-realm}
