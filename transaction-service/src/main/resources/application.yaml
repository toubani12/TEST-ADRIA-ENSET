server:
  port: 8082

spring:
  application:
    name: transaction-service
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:h2:mem:transaction-db
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
  graphql:
    graphiql:
      enabled: true

eureka:
  instance:
    prefer-ip-address: true

  # --- Kafka (partie F) ---
spring.kafka:
  bootstrap-servers: ${KAFKA_BOOTSTRAP:localhost:9092}
  producer:
    key-serializer: org.apache.kafka.common.serialization.StringSerializer
    value-serializer: org.apache.kafka.common.serialization.StringSerializer
    properties:
      max.block.ms: 3000

# --- Resilience4J (partie C3) ---
spring.cloud.openfeign:
  circuitbreaker:
    enabled: true
resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 2
        ignore-exceptions:
          - feign.FeignException$NotFound
          - feign.FeignException$BadRequest
          - feign.FeignException$Conflict
          - feign.FeignException$UnprocessableEntity
  timelimiter:
    configs:
      default:
        timeout-duration: 3s

app:
  security:
    enabled: ${SECURITY_ENABLED:true}

# --- Keycloak (resource server JWT, actif si SECURITY_ENABLED=true) ---
spring.security.oauth2.resourceserver.jwt:
  issuer-uri: ${KEYCLOAK_ISSUER:http://localhost:8080/realms/bank-realm}
