server:
  port: 8082

spring:
  application:
    name: transaction-service
  config:
    import: optional:configserver:http://localhost:8888
  datasource:
    url: jdbc:h2:mem:transaction-db
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
  graphql:
    graphiql:
      enabled: true

eureka:
  instance:
    prefer-ip-address: true
