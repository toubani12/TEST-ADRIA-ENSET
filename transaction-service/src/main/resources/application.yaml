server:
  port: 8082

spring:
  application:
    name: transaction-service
  cloud:
    config:
      enabled: false
    openfeign:
      client:
        config:
          account-service:
            url: http://localhost:8081
  datasource:
    url: jdbc:h2:mem:transaction-db
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
  graphql:
    graphiql:
      enabled: true

eureka:
  client:
    enabled: false

bank:
  transaction:
    max-amount: 1000
