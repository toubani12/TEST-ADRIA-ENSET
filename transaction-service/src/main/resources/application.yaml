server:
  port: 8082

spring:
  application:
    name: transaction-service
  cloud:
    config:
      enabled: false
  datasource:
    url: jdbc:h2:mem:transaction-db
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
  graphql:
    graphiql:
      enabled: true

eureka:
  instance:
    prefer-ip-address: true

bank:
  transaction:
    max-amount: 1000
