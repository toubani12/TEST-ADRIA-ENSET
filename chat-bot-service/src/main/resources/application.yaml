server:
  port: 8084

spring:
  application:
    name: chat-bot-service
  config:
    import: optional:file:.env[.properties],optional:file:../.env[.properties]
  ai:
    # LLM distant via une clé d'API (Groq, API compatible OpenAI) - aucun modèle entraîné localement
    openai:
      api-key: ${OPENAI_API_KEY:missing}
      base-url: ${OPENAI_BASE_URL:https://api.groq.com/openai}
      chat:
        options:
          model: ${OPENAI_MODEL:openai/gpt-oss-120b}
          temperature: 0.2
    model:
      embedding: none
      image: none
      audio.speech: none
      audio.transcription: none
      moderation: none
    mcp:
      client:
        type: SYNC
        request-timeout: 30s
        sse:
          connections:
            account-service:
              url: ${ACCOUNT_MCP_URL:http://localhost:8081}
            transaction-service:
              url: ${TRANSACTION_MCP_URL:http://localhost:8082}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true
